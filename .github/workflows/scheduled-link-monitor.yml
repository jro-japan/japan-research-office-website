name: Scheduled External Link Monitor

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    name: External link report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --exclude '^https://japanresearchoffice\.com'
            './**/*.html'
            './**/*.md'
            './**/*.txt'
          fail: false
          format: markdown
          output: ./lychee-report.md

      - name: Open an issue when broken links are found
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Automated external-link report
          content-filepath: ./lychee-report.md
          labels: automated, quality, broken-link
